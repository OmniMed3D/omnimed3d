<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OmniMed3D-Engine — WASM smoke test</title>
    <style>
        html, body { margin: 0; background: #111; color: #ddd; font-family: monospace; }
        #canvas { display: block; margin: 16px auto; background: #000; }
        #status { text-align: center; }
        /* Debug/perf overlay -- toggleable, off the render path entirely
           (pure JS/DOM driven by exported C++ getters, see
           engine_get_frame_time_ms etc. in src/main_wasm.cpp) so it can't
           skew the numbers it displays. */
        #stats-panel {
            position: fixed;
            top: 8px;
            right: 8px;
            width: 260px;
            /* max-width + wrapping, not a fixed width with white-space:
               pre -- a long GPU description string (60+ chars) would
               otherwise push this panel wider than the viewport and force
               the page to scroll horizontally. */
            max-width: calc(100vw - 16px);
            padding: 8px 10px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            pointer-events: none;
        }
        #stats-toggle {
            position: fixed;
            top: 8px;
            right: 8px;
            font-family: monospace;
            font-size: 11px;
            background: #222;
            color: #ddd;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 2px 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="status">loading...</div>
    <canvas id="canvas" width="640" height="480"></canvas>
    <pre id="log"></pre>

    <button id="stats-toggle" type="button" title="Toggle performance/hardware stats overlay">Stats</button>
    <div id="stats-panel"></div>

    <script type="text/javascript">
        function appendLog(text) {
            var el = document.getElementById('log');
            el.textContent += text + '\n';
        }
        var Module = {
            canvas: document.getElementById('canvas'),
            print: function(text) { console.log('[stdout] ' + text); appendLog('[stdout] ' + text); },
            printErr: function(text) { console.error('[stderr] ' + text); appendLog('[stderr] ' + text); },
            setStatus: function(text) {
                document.getElementById('status').textContent = text || 'running';
            },
            onRuntimeInitialized: function() {
                document.title = 'onRuntimeInitialized fired';
                // Poll engine_is_ready() via requestAnimationFrame, not
                // setInterval -- under headless Chrome + --virtual-time-budget,
                // rAF-driven callbacks were empirically confirmed to run
                // (the WASM main loop itself uses emscripten_set_main_loop,
                // which is rAF-backed) while setInterval-driven polling did
                // not reliably fire in that same environment.
                var pollCount = 0;
                var testRan = false;
                function pollFrame() {
                    if (testRan) {
                        return;
                    }
                    pollCount++;
                    document.title = 'polling #' + pollCount;
                    if (Module._engine_is_ready()) {
                        testRan = true;
                        document.title = 'ready after ' + pollCount + ' polls, running test';
                        try {
                            runVolumeMaskSmokeTest();
                            document.title = 'test done';
                        } catch (e) {
                            document.title = 'test threw: ' + e;
                            document.getElementById('status').textContent = 'exception: ' + e;
                        }
                        return;
                    }
                    requestAnimationFrame(pollFrame);
                }
                requestAnimationFrame(pollFrame);

                startStatsPanel();
            }
        };
        window.onerror = function(msg) {
            document.getElementById('status').textContent = 'error: ' + msg;
        };

        // Debug/perf overlay (toggleable). Pure JS/DOM, driven by the
        // EMSCRIPTEN_KEEPALIVE getters in src/main_wasm.cpp
        // (engine_get_frame_time_ms etc.).
        var statsPanelVisible = true;
        function setStatsPanelVisible(visible) {
            statsPanelVisible = visible;
            document.getElementById('stats-panel').style.display = visible ? 'block' : 'none';
        }
        document.getElementById('stats-toggle').addEventListener('click', function() {
            setStatsPanelVisible(!statsPanelVisible);
        });

        function startStatsPanel() {
            var panel = document.getElementById('stats-panel');
            var lastUpdateMs = 0;
            var updateIntervalMs = 250; // readable refresh rate, independent of actual frame rate

            function tick(nowMs) {
                if (statsPanelVisible && nowMs - lastUpdateMs >= updateIntervalMs) {
                    lastUpdateMs = nowMs;
                    var fps = Module._engine_get_fps();
                    var avgFrameMs = Module._engine_get_avg_frame_time_ms();
                    var vendor = Module.UTF8ToString(Module._engine_get_gpu_vendor());
                    var architecture = Module.UTF8ToString(Module._engine_get_gpu_architecture());
                    var device = Module.UTF8ToString(Module._engine_get_gpu_device());
                    var description = Module.UTF8ToString(Module._engine_get_gpu_description());

                    // GPU-side pass timing (WebGPU timestamp-query, optional
                    // feature -- "unsupported" is a real, expected state, not an
                    // error). Only one of raymarch+composite (3D Orbit) or axial
                    // (2D Slice) is ever nonzero in a given frame.
                    var gpuPassText;
                    if (Module._engine_get_gpu_timing_supported() !== 1) {
                        gpuPassText = 'unsupported';
                    } else {
                        var raymarchMs = Module._engine_get_gpu_raymarch_ms();
                        var compositeMs = Module._engine_get_gpu_composite_ms();
                        var axialMs = Module._engine_get_gpu_axial_ms();
                        if (raymarchMs > 0 || compositeMs > 0) {
                            gpuPassText = 'Raymarch ' + raymarchMs.toFixed(3) + ' + Composite ' + compositeMs.toFixed(3) + ' ms';
                        } else if (axialMs > 0) {
                            gpuPassText = 'Axial ' + axialMs.toFixed(3) + ' ms';
                        } else {
                            gpuPassText = 'n/a';
                        }
                    }

                    // FPS/Frame line: one line, pipe-separated, 3 decimal
                    // places on frame time.
                    panel.textContent =
                        'FPS: ' + fps.toFixed(1) + '  |  Frame: ' + avgFrameMs.toFixed(3) + ' ms\n' +
                        'GPU pass: ' + gpuPassText + '\n' +
                        'Canvas: ' + Module.canvas.width + 'x' + Module.canvas.height + '\n' +
                        'GPU vendor: ' + (vendor || 'n/a') + '\n' +
                        'GPU device: ' + (device || 'n/a') + '\n' +
                        'GPU arch: ' + (architecture || 'n/a') + '\n' +
                        'GPU desc: ' + (description || 'n/a');
                }
                requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        }

        // Smoke test: proves the JS -> WASM volume/mask transport
        // pipeline, not HU-value correctness or rendering -- so the
        // "volume" is arbitrary Uint16 data, not real half-floats.
        // Simulates the viewer/-owned orchestration layer (PRD #5.3.2)
        // with a hardcoded volumeId instead of one minted per file load.
        function runVolumeMaskSmokeTest() {
            var width = 32, height = 32, depth = 8;
            var volumeId = 1;

            var volumeBytes = width * height * depth * 2; // R16Float = 2 bytes/texel
            var volumePtr = Module._malloc(volumeBytes);
            var volumeView = new Uint16Array(Module.HEAPU8.buffer, volumePtr, width * height * depth);
            for (var i = 0; i < volumeView.length; i++) {
                volumeView[i] = i & 0xffff; // arbitrary pattern, not real HU data
            }
            Module._engine_load_volume(volumeId, volumePtr, volumeBytes, width, height, depth, 1.0, 1.0, 1.0, 0);
            Module._free(volumePtr);

            var sliceBytes = width * height; // uint8 class indices
            [0, 3, 7].forEach(function(sliceIndex) {
                var slicePtr = Module._malloc(sliceBytes);
                var sliceView = new Uint8Array(Module.HEAPU8.buffer, slicePtr, sliceBytes);
                sliceView.fill(sliceIndex % 3); // arbitrary class index per slice
                Module._engine_apply_mask_slice(volumeId, sliceIndex, width, height, slicePtr, sliceBytes);
                Module._free(slicePtr);
            });

            document.getElementById('status').textContent =
                'smoke test: volume ' + width + 'x' + height + 'x' + depth + ' + 3 mask slices sent';
        }
    </script>

    {{{ SCRIPT }}}
</body>
</html>
