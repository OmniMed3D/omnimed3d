# Runs the subset of viewer/'s vitest suites that don't depend on
# artifacts we deliberately don't commit (REQ-C03, first slice):
#   - inference-worker: several test/*.test.ts files load real ONNX models
#     (ai-pipeline/conversion, ai-pipeline/quantization) and calibration
#     fixtures, both covered by .gitignore's "generated model artifacts" /
#     "never commit raw medical imaging data" rules -- a fresh checkout
#     doesn't have them.
#   - parse-worker/test/pipeline.test.ts needs engine/build_wasm/ (the
#     native dicom-parser WASM build), which requires Engine's own
#     cmake/emsdk toolchain -- not wired into CI here.
# Both gaps are tracked, not silently skipped: running the full "npm test"
# in each workspace once those artifacts have a CI provisioning story is
# the natural follow-up. WebGPU e2e (Playwright, both viewer/tests/e2e/ and
# inference-worker/e2e/) is left out of CI entirely for the same reason --
# see playwright.config.ts's own comments in each of those two dirs for why
# it's macOS-only today.
#
# NN pure-logic files run here (5): inference-worker's modelSelection.ts /
# postprocess.ts unit tests, and parse-worker's assembleSeries / orientation
# / halfFloat unit tests -- none of them touch the filesystem.

name: Test

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install dependencies
        working-directory: viewer
        run: npm ci

      - name: inference-worker unit tests (fixture-free subset)
        working-directory: viewer/src/workers/inference-worker
        run: npx vitest run test/modelSelection.test.ts test/postprocess.test.ts

      - name: parse-worker unit tests (fixture-free subset)
        working-directory: viewer/src/workers/parse-worker
        run: npx vitest run test/assembleSeries.test.ts test/orientation.test.ts test/halfFloat.test.ts
